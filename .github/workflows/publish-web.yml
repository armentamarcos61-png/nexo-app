name: Publicar Nexo Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexo-web
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Configurar Python para Nexa 3D
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Crear modelo oficial con rig facial de Nexa
        run: |
          python -m pip install numpy==2.2.6
          python scripts/build_nexa_face.py

      - name: Preparar ruta estable de GitHub Pages
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'app.json';
          const app = JSON.parse(fs.readFileSync(file, 'utf8'));
          app.expo.experiments = {
            ...(app.expo.experiments || {}),
            baseUrl: '/nexo-app'
          };
          fs.writeFileSync(file, JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Compilar Nexo web
        run: npm run build:web

      - name: Guardar rig facial 3D de Nexa en el repositorio
        # The GLB was built from the original uploaded model by this workflow.
        # Once committed it can also be consumed by standalone native builds.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/Nexa_FacialRig_Pro.glb
          if ! git diff --cached --quiet; then
            git commit -m "Build Nexa facially rigged model [skip ci]"
            git push origin HEAD:main
          fi

      - name: Evitar procesamiento Jekyll
        run: touch dist/.nojekyll

      - name: Publicar rama web
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
