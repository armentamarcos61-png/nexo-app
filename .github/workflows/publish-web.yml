name: Publicar Nexo Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexo-web
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Probar carrusel de bienvenida y navegación antes del registro
        run: node scripts/verify-nexo-onboarding.cjs

      - name: Actualizar conocimiento de Nexo desde funciones verificadas
        run: |
          node scripts/build-nexo-knowledge.cjs
          node scripts/verify-nexo-knowledge.cjs
          node scripts/review-nexo-answers.cjs

      - name: Reconstruir modelo oficial 3D de Nexo
        run: node scripts/restore-nexo-male.cjs

      - name: Configurar Python para Nexa 3D
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Crear modelo oficial con rig facial de Nexa
        run: |
          python -m pip install numpy==2.2.6
          python scripts/build_nexa_face.py

      - name: Reconstruir nuevo Nexa Android 3D con animaciones y rostro
        run: node scripts/restore-nexa-android.cjs

      - name: Verificar animaciones tres segundos más largas y pistas de formularios
        run: node scripts/verify-nexo-motion-forms.cjs

      - name: Comprobar movimientos y rig facial del asistente masculino Nexo
        run: node scripts/verify-nexo-biped.cjs

      - name: Probar parpadeo, cejas, mirada y boca de Nexo a 20-120 FPS
        run: node scripts/verify-nexo-face.cjs

      - name: Restaurar modelo Nexa Studio y validar integridad
        run: node scripts/restore-nexa-studio.cjs

      - name: Verificar Nexa Android (13 gestos, 5 animaciones y respaldo)
        run: node scripts/verify-nexa-android.cjs

      - name: Comprobar geometría de unión Nexa Studio + cuerpo completo
        run: node scripts/verify-nexa-composite.cjs

      - name: Preparar ruta estable de GitHub Pages
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const file = 'app.json';
          const app = JSON.parse(fs.readFileSync(file, 'utf8'));
          app.expo.experiments = {
            ...(app.expo.experiments || {}),
            baseUrl: '/nexo-app'
          };
          fs.writeFileSync(file, JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Compilar Nexo web sin divisiones JS inestables
        # On GitHub Pages a cached HTML entry must not rely on a JS chunk
        # removed during a later publish (the source of Nexa's GLTFLoader 404).
        env:
          EXPO_NO_BUNDLE_SPLITTING: '1'
        run: npm run build:web

      - name: Comprobar que la versión publicada contiene conocimiento actualizado
        run: test -s dist/knowledge/nexo-capabilities.json

      - name: Medir lineas reales de codigo y publicar estadisticas
        run: node scripts/report-code-lines.cjs dist/code-metrics.json

      - name: Preparar panel privado fuera del enrutador Expo
        # The old Expo static route can hydrate into '/' on Android webviews.
        # The standalone page deliberately loads no Expo bundle.
        run: |
          set -euo pipefail
          cp public/nexo-control-panel.html dist/nexo-control-panel.html
          cat > dist/nexo-control.html <<'HTML'
          <!doctype html><html lang="es"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Nexo Control</title><script>
          location.replace('/nexo-app/nexo-control-panel.html'+location.search+location.hash)
          </script></head><body><a href="/nexo-app/nexo-control-panel.html">Abrir panel Nexo Control</a></body></html>
          HTML
          test -s dist/nexo-control-panel.html
          node scripts/verify-nexo-control.cjs

      - name: Recuperar módulos usados por navegadores con caché anterior
        # Old Chrome tabs can still refer to their previous Metro bundle.
        # Rescue its original scripts once and keep them on later deploys.
        run: |
          set -euo pipefail
          old_commit=eee30d5333cb566cf002f16f11aed1665da4c39f
          folder=dist/_expo/static/js/web
          mkdir -p "$folder"
          for filename in \
            GLTFLoader-ab5a874f259fec5630faff3cf5747149.js \
            __common-c3201cda969c2bb7a2f499ce6bb764ef.js \
            entry-5f3b891bfe41133c7e96d8647e29a936.js
          do
            curl --fail --location --retry 3 --silent --show-error \
              "https://raw.githubusercontent.com/armentamarcos61-png/nexo-app/$old_commit/_expo/static/js/web/$filename" \
              --output "$folder/$filename"
            test -s "$folder/$filename"
          done

      - name: Comprobar nuevo modelo Nexa en paquete web
        run: |
          test -s dist/knowledge/nexo-answer-review.json
          test -s dist/models/Nexa_Android_FacialReady_v1.glb
          test -s dist/models/Nexo_FacialReady_v1.glb

      - name: Verificar archivos para navegadores nuevos y antiguos
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/nexo-control-panel.html
          test -s dist/nexo-control.html
          test -s dist/_expo/static/js/web/GLTFLoader-ab5a874f259fec5630faff3cf5747149.js
          find dist/_expo/static/js/web -name '*.js' -size +0c | grep -q .

      - name: Guardar rig facial 3D de Nexa en el repositorio
        # The GLB was built from the original uploaded model by this workflow.
        # Once committed it can also be consumed by standalone native builds.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/report-code-lines.cjs docs/LINEAS-CODIGO.json
          git add public/models/Nexa_FacialRig_V2.glb docs/LINEAS-CODIGO.json public/models/Nexo_FacialReady_v1.glb public/models/Nexa_Android_FacialReady_v1.glb public/knowledge/nexo-capabilities.json public/knowledge/nexo-learning-history.json public/knowledge/nexo-answer-review.json
          if ! git diff --cached --quiet; then
            git commit -m "Build Nexa and Nexo facially rigged models [skip ci]"
            git push origin HEAD:main
          fi

      - name: Evitar procesamiento Jekyll
        run: touch dist/.nojekyll

      - name: Publicar rama web
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Keep hashed assets from earlier releases for clients with cached HTML.
          # Do not re-create an orphan branch on every release.
          keep_files: true
          force_orphan: false
          enable_jekyll: false
