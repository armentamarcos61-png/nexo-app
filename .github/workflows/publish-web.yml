name: Publicar Nexo Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexo-web
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias y restaurar modelo masculino
        run: npm ci

      - name: Restaurar Nexa nueva desde archivos de respaldo
        run: |
          node scripts/restore-nexa-android.cjs
          node scripts/restore-nexa-studio.cjs

      - name: Comprobar que los dos modelos existen antes de publicar
        run: |
          test -s public/models/Nexo_FacialReady_v1.glb
          test -s public/models/Nexa_Android_FacialReady_v1.glb
          test -s public/models/Nexa_FacialRig_V2.glb
          test -s public/models/Nexa_Studio_Busto_v1.glb

      - name: Actualizar conocimiento del asistente
        # Do not block the entire live app if a knowledge regression changes.
        # The separate 'Verificar Nexo' workflow remains strict.
        continue-on-error: true
        run: |
          node scripts/build-nexo-knowledge.cjs
          node scripts/review-nexo-answers.cjs

      - name: Configurar la ruta base pública
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json','utf8'));
          app.expo.experiments = {
            ...(app.expo.experiments || {}),
            baseUrl: '/nexo-app'
          };
          fs.writeFileSync('app.json',JSON.stringify(app,null,2)+'\n');
          NODE

      - name: Compilar web para GitHub Pages
        env:
          EXPO_NO_BUNDLE_SPLITTING: '1'
        run: npm run build:web

      - name: Conservar el panel de control privado
        run: |
          set -euo pipefail
          cp public/nexo-control-panel.html dist/nexo-control-panel.html
          cat > dist/nexo-control.html <<'HTML'
          <!doctype html><html lang="es"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Nexo Control</title><script>
          location.replace('/nexo-app/nexo-control-panel.html'+location.search+location.hash)
          </script></head><body><a href="/nexo-app/nexo-control-panel.html">Abrir panel Nexo Control</a></body></html>
          HTML
          touch dist/.nojekyll

      - name: Contar líneas de código
        run: node scripts/report-code-lines.cjs dist/code-metrics.json

      - name: Verificar archivos visibles y 3D en la versión final
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/models/Nexa_Android_FacialReady_v1.glb
          test -s dist/models/Nexo_FacialReady_v1.glb
          test -s dist/knowledge/nexo-capabilities.json
          test -s dist/nexo-control-panel.html
          find dist/_expo/static/js/web -name '*.js' -size +0c | grep -q .

      - name: Publicar aplicación
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: true
          force_orphan: false
          enable_jekyll: false
