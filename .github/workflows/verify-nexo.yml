name: Verificar Nexo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar TypeScript
        run: npx tsc --noEmit

      - name: Revisar lint
        run: npx expo lint

      - name: Comprobar que Nexa sea una sola
        run: node scripts/verify-nexa-singleton.mjs

      - name: Verificar empaquetado Android
        run: npx expo export --platform android

      - name: Compilar web
        run: npm run build:web
