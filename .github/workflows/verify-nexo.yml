name: Verificar Nexo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Actualizar conocimiento de Nexo desde funciones verificadas
        run: |
          node scripts/build-nexo-knowledge.cjs
          node scripts/verify-nexo-knowledge.cjs

      - name: Reconstruir modelo oficial 3D de Nexo
        run: node scripts/restore-nexo-male.cjs

      - name: Configurar Python para Nexa 3D
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generar el modelo 3D de Nexa para las pruebas
        run: |
          python -m pip install numpy==2.2.6
          python scripts/build_nexa_face.py

      - name: Reconstruir nuevo Nexa Android 3D con animaciones y rostro
        run: node scripts/restore-nexa-android.cjs

      - name: Comprobar movimientos y rig facial del asistente masculino Nexo
        run: node scripts/verify-nexo-biped.cjs

      - name: Probar parpadeo, cejas, mirada y boca de Nexo a 20-120 FPS
        run: node scripts/verify-nexo-face.cjs

      - name: Restaurar y validar Nexa Studio 3D
        run: node scripts/restore-nexa-studio.cjs

      - name: Verificar Nexa Android (13 gestos, 5 animaciones y respaldo)
        run: node scripts/verify-nexa-android.cjs

      - name: Comprobar geometría de unión Nexa Studio + cuerpo completo
        run: node scripts/verify-nexa-composite.cjs

      - name: Verificar TypeScript
        run: npx tsc --noEmit

      - name: Revisar lint
        run: npx expo lint

      - name: Comprobar que Nexa sea una sola
        run: node scripts/verify-nexa-singleton.mjs

      - name: Probar boca, párpados y cráneo estable
        run: node scripts/verify-nexa-face.cjs

      - name: Verificar empaquetado Android
        # DOM WebViews are exported as web assets inside Android; Expo 57's
        # shared __common chunks otherwise break serializeHtmlWithAssets.
        # This does NOT disable bundling or verification of the native app.
        env:
          EXPO_NO_BUNDLE_SPLITTING: '1'
        run: npx expo export --platform android

      - name: Compilar web
        run: npm run build:web
